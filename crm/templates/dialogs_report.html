{% extends 'base.html' %}
{% block title %}Диалоги{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0"><i class="bi bi-chat-dots me-2"></i>Диалоги</h4>
</div>

<style>
.dlg-wrap { display:flex; height:calc(100vh - 180px); min-height:480px; border:1px solid #e3e6ec; border-radius:10px; overflow:hidden; background:#fff; }
.dlg-list { width:320px; flex-shrink:0; border-right:1px solid #e3e6ec; display:flex; flex-direction:column; }
.dlg-list-items { flex:1; overflow-y:auto; }
.dlg-item { padding:10px 14px; border-bottom:1px solid #f0f1f4; cursor:pointer; }
.dlg-item:hover { background:#f8f9fb; }
.dlg-item.active { background:#eef3ff; }
.dlg-item-top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
.dlg-item-name { font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dlg-item-time { font-size:11px; color:#8a8f98; flex-shrink:0; }
.dlg-item-preview { font-size:12.5px; color:#6c757d; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
.dlg-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
.dlg-chat-header { padding:10px 16px; border-bottom:1px solid #e3e6ec; font-weight:600; font-size:14px; }
.dlg-chat-body { flex:1; overflow-y:auto; padding:16px; background:#f8f9fb; }
.dlg-chat-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#8a8f98; font-size:13px; }
.dlg-bubble-row { display:flex; margin-bottom:10px; }
.dlg-bubble-row.out { justify-content:flex-end; }
.dlg-bubble { max-width:70%; }
.dlg-bubble-text { border-radius:12px; padding:8px 12px; font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
.dlg-bubble-row.in .dlg-bubble-text { background:#e9ecef; color:#212529; }
.dlg-bubble-row.out .dlg-bubble-text { background:#0d6efd; color:#fff; }
.dlg-bubble-time { font-size:11px; color:#8a8f98; margin-top:3px; }
.dlg-bubble-row.out .dlg-bubble-time { text-align:right; }
.dlg-bubble-img { max-width:260px; border-radius:10px; display:block; cursor:pointer; }
.dlg-reply { border-top:1px solid #e3e6ec; padding:10px 14px; display:flex; gap:8px; }
.dlg-reply textarea { resize:none; }
</style>

<div class="dlg-wrap">
    <div class="dlg-list">
        <div class="p-2 border-bottom">
            <input type="text" class="form-control form-control-sm" id="dlgSearch" placeholder="Поиск по телефону...">
        </div>
        <div class="dlg-list-items" id="dlgListItems">
            <div class="text-muted text-center py-4 small">Загрузка...</div>
        </div>
    </div>
    <div class="dlg-chat">
        <div class="dlg-chat-header" id="dlgChatHeader">Выберите диалог слева</div>
        <div class="dlg-chat-body" id="dlgChatBody">
            <div class="dlg-chat-empty">Нет открытого диалога</div>
        </div>
        <div class="dlg-reply" id="dlgReplyWrap" style="display:none;">
            <textarea class="form-control form-control-sm" id="dlgReplyText" rows="1" placeholder="Написать сообщение..."></textarea>
            <button type="button" class="btn btn-primary btn-sm" id="dlgReplyBtn" onclick="dlgSendReply()">
                <i class="bi bi-send"></i>
            </button>
        </div>
    </div>
</div>

<!-- Просмотр фото на весь экран -->
<div class="modal fade" id="dlgImageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <img id="dlgImageModalImg" src="" style="max-width:100%; max-height:80vh; margin:auto; border-radius:8px;">
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
(function () {
    var currentThread = null;   // {account_id, contact_ref}
    var lastMsgId = 0;
    var threadsCache = [];
    var pollThreadsTimer = null;
    var pollMessagesTimer = null;

    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function threadKey(t) { return t.account_id + '|' + t.contact_ref; }

    function renderThreadList(threads) {
        var wrap = document.getElementById('dlgListItems');
        if (!threads.length) {
            wrap.innerHTML = '<div class="text-muted text-center py-4 small">Диалогов пока нет</div>';
            return;
        }
        var q = (document.getElementById('dlgSearch').value || '').trim().toLowerCase();
        var html = '';
        threads.forEach(function (t) {
            if (q && t.label.toLowerCase().indexOf(q) === -1 && (t.contact_ref || '').toLowerCase().indexOf(q) === -1) return;
            var active = currentThread && threadKey(currentThread) === threadKey(t);
            var prefix = t.last_direction === 'out' ? 'Вы: ' : '';
            html += '<div class="dlg-item' + (active ? ' active' : '') + '" data-key="' + threadKey(t) + '" onclick="dlgOpenThreadByKey(\'' + threadKey(t) + '\')">' +
                '<div class="dlg-item-top">' +
                    '<span class="dlg-item-name">' + escapeHtml(t.label) + '</span>' +
                    '<span class="dlg-item-time">' + escapeHtml(t.last_at) + '</span>' +
                '</div>' +
                '<div class="dlg-item-preview">' +
                    '<span class="badge bg-light text-dark border me-1" style="font-size:9.5px;">' + escapeHtml(t.channel_label) + '</span>' +
                    escapeHtml(prefix + t.last_preview) +
                '</div>' +
            '</div>';
        });
        wrap.innerHTML = html || '<div class="text-muted text-center py-4 small">Ничего не найдено</div>';
    }

    function loadThreads(preserveSelection) {
        fetch('/api/dialogs/threads')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) return;
                threadsCache = d.threads;
                renderThreadList(threadsCache);
            });
    }

    window.dlgOpenThreadByKey = function (key) {
        var t = threadsCache.filter(function (x) { return threadKey(x) === key; })[0];
        if (!t) return;
        dlgOpenThread(t);
    };

    function dlgOpenThread(t) {
        currentThread = { account_id: t.account_id, contact_ref: t.contact_ref };
        lastMsgId = 0;
        renderThreadList(threadsCache);
        document.getElementById('dlgChatHeader').textContent = t.label + ' · ' + t.channel_label;
        document.getElementById('dlgChatBody').innerHTML = '<div class="dlg-chat-empty">Загрузка…</div>';
        document.getElementById('dlgReplyWrap').style.display = '';
        loadMessages(true);
        if (pollMessagesTimer) clearInterval(pollMessagesTimer);
        pollMessagesTimer = setInterval(function () { loadMessages(false); }, 4000);
    }

    function bubbleHtml(m) {
        var dir = m.direction === 'out' ? 'out' : 'in';
        var inner = '';
        if (m.has_image) {
            inner += '<img class="dlg-bubble-img mb-1" src="' + m.image_url + '" onclick="dlgShowImage(\'' + m.image_url + '\')">';
        } else if (m.image_deleted) {
            inner += '<div class="dlg-bubble-text text-muted fst-italic">Фото (удалено, хранится 6 месяцев)</div>';
        }
        if (m.text) {
            inner += '<div class="dlg-bubble-text">' + escapeHtml(m.text) + '</div>';
        } else if (!m.has_image && !m.image_deleted) {
            inner += '<div class="dlg-bubble-text text-muted fst-italic">(пусто)</div>';
        }
        return '<div class="dlg-bubble-row ' + dir + '"><div class="dlg-bubble">' + inner +
            '<div class="dlg-bubble-time">' + escapeHtml(m.created_at) + '</div></div></div>';
    }

    function loadMessages(replace) {
        if (!currentThread) return;
        var url = '/api/dialogs/thread/' + currentThread.account_id + '/' + encodeURIComponent(currentThread.contact_ref) + '/messages';
        if (!replace && lastMsgId) url += '?after_id=' + lastMsgId;
        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) return;
                var body = document.getElementById('dlgChatBody');
                if (replace) {
                    if (!d.messages.length) {
                        body.innerHTML = '<div class="dlg-chat-empty">Сообщений пока нет</div>';
                    } else {
                        body.innerHTML = d.messages.map(bubbleHtml).join('');
                    }
                    body.scrollTop = body.scrollHeight;
                } else if (d.messages.length) {
                    var wasAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
                    if (body.querySelector('.dlg-chat-empty')) body.innerHTML = '';
                    body.insertAdjacentHTML('beforeend', d.messages.map(bubbleHtml).join(''));
                    if (wasAtBottom) body.scrollTop = body.scrollHeight;
                }
                if (d.messages.length) lastMsgId = d.messages[d.messages.length - 1].id;
            });
    }

    window.dlgSendReply = function () {
        if (!currentThread) return;
        var ta = document.getElementById('dlgReplyText');
        var text = ta.value.trim();
        if (!text) return;
        var btn = document.getElementById('dlgReplyBtn');
        btn.disabled = true;
        fetch('/api/dialogs/thread/' + currentThread.account_id + '/' + encodeURIComponent(currentThread.contact_ref) + '/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                btn.disabled = false;
                if (!d.ok) {
                    alert('Не удалось отправить: ' + (d.error || 'ошибка'));
                    return;
                }
                ta.value = '';
                var body = document.getElementById('dlgChatBody');
                if (body.querySelector('.dlg-chat-empty')) body.innerHTML = '';
                body.insertAdjacentHTML('beforeend', bubbleHtml(d.message));
                body.scrollTop = body.scrollHeight;
                lastMsgId = d.message.id;
                loadThreads();
            })
            .catch(function () {
                btn.disabled = false;
                alert('Не удалось отправить — проверьте соединение');
            });
    };

    document.getElementById('dlgReplyText').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            dlgSendReply();
        }
    });
    document.getElementById('dlgSearch').addEventListener('input', function () {
        renderThreadList(threadsCache);
    });

    var dlgImgModal = null;
    window.dlgShowImage = function (url) {
        if (!dlgImgModal) dlgImgModal = new bootstrap.Modal(document.getElementById('dlgImageModal'));
        document.getElementById('dlgImageModalImg').src = url;
        dlgImgModal.show();
    };

    loadThreads();
    pollThreadsTimer = setInterval(function () { loadThreads(); }, 5000);
})();
</script>
{% endblock %}
